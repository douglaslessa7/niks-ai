
[functions.analyze-skin]
enabled = true
verify_jwt = true
import_map = "./functions/analyze-skin/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/analyze-skin/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/analyze-skin/*.html" ]

[functions.revenuecat-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/revenuecat-webhook/index.ts"

[functions.validar-cupom]
enabled = true
verify_jwt = false
entrypoint = "./functions/validar-cupom/index.ts"

[functions.atribuir-cupom]
enabled = true
verify_jwt = false
entrypoint = "./functions/atribuir-cupom/index.ts"

[functions.cleanup-skin-previews]
enabled = true
# pg_cron não tem sessão de usuário — a trava é o header x-cleanup-secret.
verify_jwt = false
entrypoint = "./functions/cleanup-skin-previews/index.ts"

[functions.cleanup-orphan-storage]
enabled = true
# pg_cron não tem sessão de usuário — a trava é o header x-cleanup-secret
# (segredo próprio: ORPHAN_CLEANUP_SECRET / Vault cleanup_orphan_storage_secret).
# Remoção só com o secret ORPHAN_CLEANUP_REMOVE=true; sem ele roda a seco.
verify_jwt = false
entrypoint = "./functions/cleanup-orphan-storage/index.ts"

[functions.delete-account]
enabled = true
# O app manda a sessão real da usuária; a função ainda revalida o JWT por conta
# própria (_shared/jwt.ts), então são duas camadas.
verify_jwt = true
entrypoint = "./functions/delete-account/index.ts"

[functions.recortar-produto]
enabled = true
# Mesmo padrão da analisar-produto/niks-chat: o gateway não barra, e a função
# verifica o JWT localmente (_shared/jwt.ts) — o user_id vem do token, nunca do corpo.
verify_jwt = false
entrypoint = "./functions/recortar-produto/index.ts"

[functions.cartas]
enabled = true
# Sistema de cartas: o sorteio é feito aqui. Mesmo padrão da recortar-produto — o gateway
# não barra, a função verifica o JWT localmente e o user_id vem do token.
verify_jwt = false
entrypoint = "./functions/cartas/index.ts"

[functions.recortar-catalogo]
enabled = true
# Lote de recorte do catálogo — só administrador: a trava é o header x-admin-secret
# (secret CATALOG_CUTOUT_SECRET). O app nunca chama.
verify_jwt = false
entrypoint = "./functions/recortar-catalogo/index.ts"

[functions.montar-rotina-com-produtos]
enabled = true
# Mesmo padrão do analisar-produto: o gateway não barra, e a função verifica o JWT
# localmente (_shared/jwt.ts) — o user_id vem do token, nunca do corpo.
verify_jwt = false
entrypoint = "./functions/montar-rotina-com-produtos/index.ts"

[functions.superwall-webhook]
enabled = true
# Eventos de loja do Superwall → assinaturas_loja. Sem sessão: a trava é a assinatura
# Svix (SUPERWALL_WEBHOOK_SECRET), conferida sobre o corpo cru.
verify_jwt = false
entrypoint = "./functions/superwall-webhook/index.ts"

[functions.assinatura]
enabled = true
# Assinatura conferida no servidor (vincular o id anônimo do RevenueCat, status). Mesmo
# padrão da cartas: o gateway não barra, a função verifica o JWT localmente.
verify_jwt = false
entrypoint = "./functions/assinatura/index.ts"

[functions.grupos]
enabled = true
# Grupos (fase 3): o banco não tem política para o app; tudo passa por aqui. Mesmo padrão
# da cartas: o gateway não barra, a função verifica o JWT localmente.
verify_jwt = false
entrypoint = "./functions/grupos/index.ts"

[functions.convite]
enabled = true
# Link do convite: só um 302 para niks-ai://convite/<token>. Público (o link é clicado
# fora do app); não lê nem grava nada.
verify_jwt = false
entrypoint = "./functions/convite/index.ts"
